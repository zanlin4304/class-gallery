<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>經典青蛙過河 (Frogger)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #scoreboard {
      width: 100%;
      max-width: 448px;
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #222;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    canvas {
      background: #000;
      border: 2px solid #333;
      display: block;
      image-rendering: pixelated;
    }
    #dpad {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 50px);
      gap: 6px;
    }
    .btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      active-background: #555;
    }
    .btn:active {
      background: #666;
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="scoreboard">
      <span>得分: <span id="score">0</span></span>
      <span>最高: <span id="high-score">0</span></span>
      <span>生命: <span id="lives">3</span></span>
    </div>
    <canvas id="gameCanvas" width="448" height="512"></canvas>

    <div id="dpad">
      <button class="btn" id="btn-up">▲</button>
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-down">▼</button>
      <button class="btn" id="btn-right">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const livesEl = document.getElementById('lives');

    const GRID = 32;
    const COLS = 14; // 448 / 32
    const ROWS = 16; // 512 / 32

    // 遊戲狀態
    let score = 0;
    let highScore = 0;
    let lives = 3;
    let gameOver = false;
    let gameWon = false;

    // 青蛙
    const frog = {
      x: 6 * GRID + 8,
      y: 14 * GRID + 8,
      size: 16,
      step: GRID,
      dir: 'UP'
    };

    // 終點 5 個巢穴 (格位: 1, 4, 7, 10, 13)
    const homes = [
      { col: 1, filled: false },
      { col: 4, filled: false },
      { col: 7, filled: false },
      { col: 10, filled: false },
      { col: 13, filled: false }
    ];

    // 車輛與浮木行配置
    // 行 1~5: 河流 (Row 3, 4, 5, 6, 7)
    // 行 9~13: 馬路 (Row 9, 10, 11, 12, 13)
    const lanes = [
      // 河流 (浮木 / 烏龜)
      { row: 3, speed: 1.5, type: 'log', length: 3 * GRID, color: '#8B4513', count: 3, spacing: 160 },
      { row: 4, speed: -1.2, type: 'turtle', length: 2 * GRID, color: '#2E8B57', count: 4, spacing: 120 },
      { row: 5, speed: 2.2, type: 'log', length: 4 * GRID, color: '#8B4513', count: 2, spacing: 220 },
      { row: 6, speed: -1.8, type: 'turtle', length: 2.5 * GRID, color: '#2E8B57', count: 3, spacing: 150 },
      { row: 7, speed: 1.0, type: 'log', length: 3 * GRID, color: '#8B4513', count: 3, spacing: 160 },

      // 馬路 (車輛)
      { row: 9, speed: -2.0, type: 'car', length: 1.2 * GRID, color: '#FF6347', count: 3, spacing: 150 },
      { row: 10, speed: 1.6, type: 'car', length: 1.5 * GRID, color: '#FFD700', count: 3, spacing: 160 },
      { row: 11, speed: -2.5, type: 'car', length: 1.2 * GRID, color: '#FF4500', count: 4, spacing: 120 },
      { row: 12, speed: 1.2, type: 'car', length: 2.2 * GRID, color: '#9370DB', count: 2, spacing: 220 },
      { row: 13, speed: -1.4, type: 'car', length: 1.2 * GRID, color: '#1E90FF', count: 3, spacing: 150 }
    ];

    // 初始化障礙物陣列
    const obstacles = [];
    lanes.forEach(lane => {
      for (let i = 0; i < lane.count; i++) {
        obstacles.push({
          row: lane.row,
          x: i * lane.spacing,
          y: lane.row * GRID,
          w: lane.length,
          h: GRID - 4,
          speed: lane.speed,
          color: lane.color,
          isRiver: lane.row <= 7
        });
      }
    });

    function resetFrog() {
      frog.x = 6 * GRID + 8;
      frog.y = 14 * GRID + 8;
      frog.dir = 'UP';
    }

    function killFrog() {
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) {
        gameOver = true;
      } else {
        resetFrog();
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      gameWon = false;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      homes.forEach(h => h.filled = false);
      resetFrog();
    }

    function moveFrog(dir) {
      if (gameOver || gameWon) {
        resetGame();
        return;
      }

      frog.dir = dir;
      if (dir === 'UP' && frog.y > GRID) {
        frog.y -= GRID;
        score += 10;
      } else if (dir === 'DOWN' && frog.y < 14 * GRID) {
        frog.y += GRID;
      } else if (dir === 'LEFT' && frog.x > GRID) {
        frog.x -= GRID;
      } else if (dir === 'RIGHT' && frog.x < canvas.width - 2 * GRID) {
        frog.x += GRID;
      }

      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
      }
      scoreEl.textContent = score;
    }

    // 鍵盤控制
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          moveFrog('UP');
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          moveFrog('DOWN');
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          moveFrog('LEFT');
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          moveFrog('RIGHT');
          break;
      }
    });

    // 虛擬按鍵控制
    document.getElementById('btn-up').onclick = () => moveFrog('UP');
    document.getElementById('btn-down').onclick = () => moveFrog('DOWN');
    document.getElementById('btn-left').onclick = () => moveFrog('LEFT');
    document.getElementById('btn-right').onclick = () => moveFrog('RIGHT');

    // 碰撞偵測輔助函式 (AABB)
    function checkCollision(r1, r2) {
      return (
        r1.x < r2.x + r2.w &&
        r1.x + r1.w > r2.x &&
        r1.y < r2.y + r2.h &&
        r1.y + r1.h > r2.y
      );
    }

    function update() {
      if (gameOver || gameWon) return;

      // 更新所有障礙物位置
      obstacles.forEach(obs => {
        obs.x += obs.speed;
        if (obs.speed > 0 && obs.x > canvas.width) {
          obs.x = -obs.w;
        } else if (obs.speed < 0 && obs.x + obs.w < 0) {
          obs.x = canvas.width;
        }
      });

      const frogBox = {
        x: frog.x,
        y: frog.y,
        w: frog.size,
        h: frog.size
      };

      const frogRow = Math.floor((frog.y + frog.size / 2) / GRID);

      // 檢查終點區 (Row 1-2)
      if (frogRow <= 2) {
        let reachedHome = false;
        homes.forEach(home => {
          const homeX = home.col * GRID;
          const homeBox = { x: homeX, y: 2 * GRID, w: GRID, h: GRID };
          if (checkCollision(frogBox, homeBox)) {
            if (!home.filled) {
              home.filled = true;
              score += 200;
              scoreEl.textContent = score;
              reachedHome = true;
              resetFrog();

              // 檢查通關
              if (homes.every(h => h.filled)) {
                gameWon = true;
              }
            }
          }
        });

        // 碰壁未進洞
        if (!reachedHome && !gameWon) {
          killFrog();
        }
        return;
      }

      // 檢查河流區 (Row 3-7)
      if (frogRow >= 3 && frogRow <= 7) {
        let onLog = false;
        obstacles.forEach(obs => {
          if (obs.isRiver && checkCollision(frogBox, obs)) {
            onLog = true;
            frog.x += obs.speed; // 隨浮木移動
          }
        });

        // 落水或漂出邊界
        if (!onLog || frog.x < 0 || frog.x + frog.size > canvas.width) {
          killFrog();
          return;
        }
      }

      // 檢查馬路區 (Row 9-13)
      if (frogRow >= 9 && frogRow <= 13) {
        obstacles.forEach(obs => {
          if (!obs.isRiver && checkCollision(frogBox, obs)) {
            killFrog();
          }
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 繪製背景與區塊
      // 終點區
      ctx.fillStyle = '#104e10';
      ctx.fillRect(0, 0, canvas.width, 3 * GRID);

      // 終點 5 個凹槽
      homes.forEach(home => {
        ctx.fillStyle = home.filled ? '#00FF00' : '#000033';
        ctx.fillRect(home.col * GRID, 2 * GRID, GRID, GRID);
        if (home.filled) {
          ctx.fillStyle = '#0f0';
          ctx.fillRect(home.col * GRID + 8, 2 * GRID + 8, 16, 16);
        }
      });

      // 河流區 (Row 3~7)
      ctx.fillStyle = '#10206b';
      ctx.fillRect(0, 3 * GRID, canvas.width, 5 * GRID);

      // 中間安全島 (Row 8)
      ctx.fillStyle = '#331144';
      ctx.fillRect(0, 8 * GRID, canvas.width, GRID);

      // 馬路區 (Row 9~13)
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 9 * GRID, canvas.width, 5 * GRID);

      // 起點安全區 (Row 14~15)
      ctx.fillStyle = '#331144';
      ctx.fillRect(0, 14 * GRID, canvas.width, 2 * GRID);

      // 2. 繪製浮木、烏龜、車輛
      obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y + 2, obs.w, obs.h);
      });

      // 3. 繪製青蛙 (像素風矩形組合)
      ctx.fillStyle = '#00FF00';
      ctx.fillRect(frog.x, frog.y, frog.size, frog.size);
      ctx.fillStyle = '#FFFFFF';
      if (frog.dir === 'UP') {
        ctx.fillRect(frog.x + 2, frog.y + 2, 4, 4);
        ctx.fillRect(frog.x + 10, frog.y + 2, 4, 4);
      } else if (frog.dir === 'DOWN') {
        ctx.fillRect(frog.x + 2, frog.y + 10, 4, 4);
        ctx.fillRect(frog.x + 10, frog.y + 10, 4, 4);
      } else if (frog.dir === 'LEFT') {
        ctx.fillRect(frog.x + 2, frog.y + 2, 4, 4);
        ctx.fillRect(frog.x + 2, frog.y + 10, 4, 4);
      } else if (frog.dir === 'RIGHT') {
        ctx.fillRect(frog.x + 10, frog.y + 2, 4, 4);
        ctx.fillRect(frog.x + 10, frog.y + 10, 4, 4);
      }

      // 4. 遊戲結束 / 通關覆蓋層
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FF3333';
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#FFF';
        ctx.font = '16px sans-serif';
        ctx.fillText('按任意鍵重新開始', canvas.width / 2, canvas.height / 2 + 30);
      } else if (gameWon) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#33FF33';
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VICTORY!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#FFF';
        ctx.font = '16px sans-serif';
        ctx.fillText('恭喜通關！按任意鍵再玩一次', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    // 主迴圈
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
