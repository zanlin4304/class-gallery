<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>種樹吧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：全螢幕畫布場景。上方 HUD（時間／分數／樹種進度點）→ 傳送帶跑條 → 背景森林 → 下方三個出場格。
   單一視覺世界：從熱到發紅的荒地，隨樹木變多慢慢變綠，UI 用暖棕＋奶油色，不做深淺主題切換。 */
:root {
  --ink: #2c1b10;
  --cream: #fff4dc;
  --paper: #fffaf0;
  --leaf: #3f9b4f;
  --leaf-d: #2b6e3a;
  --clay: #c8553d;
  --bark: #6b4423;
  --hud: rgba(44, 27, 16, .72);
  --f-display: "LXGW WenKai TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html { height: 100%; overscroll-behavior: none; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--clay); color: var(--cream); font-family: var(--f-body);
  -webkit-user-select: none; user-select: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
  background: var(--hud); border-bottom: 1px solid rgba(255, 255, 255, .14);
  backdrop-filter: blur(4px); pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand b { font: 700 24px/1 var(--f-display); letter-spacing: .08em; }
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat span { font-size: 12px; letter-spacing: .12em; opacity: .78; }
.stat b { font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 1.6ch; }
.stat.warn b { color: #ff9b7a; animation: blink .5s steps(2) infinite; }
.stat b.pop { animation: pop .22s ease-out; }
.green { display: flex; align-items: center; gap: 6px; }
.green span { font-size: 12px; letter-spacing: .12em; opacity: .78; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 250px; }
.pip { width: 11px; height: 11px; border-radius: 50%; background: rgba(255, 255, 255, .2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28); }
.pip:nth-child(3n) { margin-right: 4px; }
.pip.on { background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.pip.on.new { animation: pop .45s ease-out; }
#stCombo b { color: #ffd15a; }
#btnSound {
  pointer-events: auto; cursor: pointer; font: 500 12px/1 var(--f-body); color: var(--cream);
  background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px; padding: 6px 12px;
}
#btnSound:focus-visible, .go:focus-visible { outline: 3px solid #ffd15a; outline-offset: 2px; }
@keyframes blink { 50% { opacity: .35; } }
@keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
@media (max-width: 560px) {
  #hud { gap: 2px 12px; padding-bottom: 6px; }
  .brand b { font-size: 20px; }
  .stat b { font-size: 21px; }
  .pip { width: 9px; height: 9px; }
  .pips { max-width: 190px; }
}

#overlay {
  position: absolute; inset: 0; z-index: 5; display: flex; padding: 16px; box-sizing: border-box;
  background: rgba(30, 16, 8, .58); overflow: auto; touch-action: pan-y;
}
.card {
  margin: auto; width: min(600px, 100%); box-sizing: border-box; position: relative;
  background: var(--paper); color: var(--ink); border-radius: 20px; padding: 22px 22px 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  -webkit-user-select: text; user-select: text;
}
.kicker { font: 700 13px/1 var(--f-body); letter-spacing: .2em; color: var(--clay); margin-bottom: 8px; }
.card h1, .card h2 { margin: 0 0 8px; font: 700 clamp(38px, 9vw, 54px)/1.05 var(--f-display); letter-spacing: .06em; }
.lead { margin: 0 0 12px; font-size: 15px; line-height: 1.7; }
.lands { display: grid; gap: 5px; margin-bottom: 10px; }
.land { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: center; background: #f5ead2; border-radius: 10px; padding: 6px 10px; }
.land b { font: 700 15px/1.2 var(--f-display); }
.land div { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.land i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
.mats-t { margin: 0 0 4px; font: 700 13px/1 var(--f-body); letter-spacing: .12em; color: #7a5b3a; }
.mats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
.mats span { display: flex; align-items: center; gap: 2px; font-size: 12px; }
.ic { width: 30px; height: 30px; flex: none; }
.rules { margin: 0 0 16px; padding-left: 1.2em; font-size: 14px; line-height: 1.75; }
.go {
  display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; cursor: pointer;
  font: 700 20px/1 var(--f-display); letter-spacing: .24em; color: #fff; background: var(--leaf); box-shadow: 0 4px 0 var(--leaf-d);
}
.go:hover { filter: brightness(1.07); }
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--leaf-d); }
.result { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 12px 0 8px; }
.result span { display: block; font-size: 12px; color: #7a5b3a; letter-spacing: .1em; }
.result b { font: 700 34px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stars { font: 700 34px/1 var(--f-display); color: #e0a020; letter-spacing: .12em; margin-bottom: 8px; }
#oMsg { margin: 0 0 16px; font-size: 15px; line-height: 1.7; }
.brand small { font: 700 12px/1 var(--f-body); letter-spacing: .12em; background: rgba(255, 255, 255, .2); border-radius: 999px; padding: 4px 9px; }
.diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
.diff {
  cursor: pointer; border: 0; border-radius: 14px; padding: 12px 6px 10px; color: #fff; text-align: center;
  font-family: var(--f-body); background: var(--bg); box-shadow: 0 4px 0 var(--sh);
}
.diff:hover { filter: brightness(1.07); }
.diff:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--sh); }
.diff:focus-visible { outline: 3px solid #ffd15a; outline-offset: 2px; }
.diff b { display: block; font: 700 22px/1.1 var(--f-display); letter-spacing: .14em; }
.diff span { display: block; font-size: 14px; font-weight: 700; margin-top: 5px; }
.diff small { display: block; font-size: 11px; line-height: 1.4; opacity: .92; margin-top: 3px; }
.diff.easy { --bg: #3f9b4f; --sh: #2b6e3a; }
.diff.mid { --bg: #cf8a1c; --sh: #986310; }
.diff.hard { --bg: #c8553d; --sh: #8f3524; }
.more { margin: 0 0 12px; }
.more summary { cursor: pointer; font: 700 13px/1.6 var(--f-body); letter-spacing: .08em; color: #7a5b3a; margin-bottom: 6px; }
.btns { display: grid; gap: 8px; }
.go.alt { background: #efe3c8; color: var(--ink); box-shadow: 0 4px 0 #cdb98c; font-size: 16px; letter-spacing: .14em; padding: 12px; }
.go.alt:active { box-shadow: 0 2px 0 #cdb98c; }
@media (max-width: 460px) {
  .card { padding: 18px 16px 16px; }
  .land { grid-template-columns: 1fr; gap: 2px; }
}
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="種樹遊戲畫面"></canvas>

  <header id="hud">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="10" r="8" fill="#5fbf55"/><circle cx="8" cy="12" r="5" fill="#4aa447"/><rect x="11.5" y="14" width="3" height="10" rx="1" fill="#a06a36"/></svg>
      <b>種樹吧</b>
      <small id="vDiff">簡單</small>
    </div>
    <div class="stat" id="stTime"><span>時間</span><b id="vTime">120</b></div>
    <div class="stat"><span>分數</span><b id="vScore">0</b></div>
    <div class="stat"><span>已種</span><b id="vTrees">0/18</b></div>
    <div class="green"><span>樹種</span><div class="pips" id="pips"></div></div>
    <div class="stat" id="stCombo" hidden><span>連擊</span><b id="vCombo">0</b></div>
    <button id="btnSound" type="button" aria-pressed="true">音效 開</button>
  </header>

  <section id="overlay">
    <div class="card" id="menu">
      <div class="kicker">把荒地種回森林</div>
      <h1>種樹吧</h1>
      <p class="lead">上方跑條會送來材料。抓起材料，拖到下面的格子，照格子上方的圖示順序種樹。選一個難度，時間內種完指定棵數就過關。</p>
      <div class="diffs" id="diffs"></div>
      <ul class="rules">
        <li>抓起來就要馬上用：拖到格子放開才算，放在別處就浪費。</li>
        <li>每種樹的步驟不同。順序錯了，材料報銷、扣分、連擊歸零。</li>
        <li>三個難度都是 120 秒。剩下的時間換成加分，種得越快星星越多。</li>
      </ul>
      <details class="more">
        <summary>18 種樹和 8 種材料（每局從中抽樹）</summary>
        <div class="lands" id="lands"></div>
        <p class="mats-t">8 種材料</p>
        <div class="mats" id="mats"></div>
      </details>
    </div>

    <div class="card" id="over" hidden>
      <div class="kicker" id="oRank">時間到</div>
      <h2 id="oTitle">時間到</h2>
      <div class="stars" id="oStars" hidden></div>
      <div class="result">
        <div><span>分數</span><b id="oScore">0</b></div>
        <div><span>種下</span><b id="oTrees">0</b></div>
        <div id="oTimeBox"><span>剩餘時間</span><b id="oTime">0</b></div>
        <div><span>最高分</span><b id="oBest">0</b></div>
      </div>
      <p id="oMsg"></p>
      <div class="btns">
        <button class="go" id="btnNext" type="button" hidden>挑戰下一個難度</button>
        <button class="go" id="btnAgain" type="button">再種一次</button>
        <button class="go alt" id="btnMenu" type="button">選難度</button>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
'use strict';

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const app = $('app'), cv = $('c'), ctx = cv.getContext('2d'), hud = $('hud');
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const elastic = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1;
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgb = (c, a) => a === undefined ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')' : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), 0, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(.01, r), 0, TAU); }
function poly(c, pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }

const FONT_D = '"LXGW WenKai TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const FONT_B = '"Noto Sans TC","Microsoft JhengHei",sans-serif';

/* ================= 遊戲設定 ================= */
const STEP_PTS = 10, TREE_PTS = 50, TIME_BONUS = 5;

/* 三個難度：時間都是 120 秒，差在要種幾棵。簡單只出 3 步驟的樹；星星看剩餘秒數 */
const DIFFS = [
  { id: 'easy', name: '簡單', goal: 6, time: 120, maxSteps: 3, star3: 50, star2: 25, note: '只出 3 步驟的樹' },
  { id: 'mid', name: '中等', goal: 9, time: 120, maxSteps: 4, star3: 30, star2: 12, note: '會出 4 步驟的樹' },
  { id: 'hard', name: '困難', goal: 12, time: 120, maxSteps: 4, star3: 20, star2: 6, note: '會出 4 步驟的樹' }
];

/* 8 種材料（原 7 種＋針葉苗） */
const ITEMS = {
  worker: '工人', sapling: '樹苗', conifer: '針葉苗', seed: '種子',
  water: '水', straw: '草方格', stake: '木樁', rock: '石塊'
};
const ITEM_KEYS = Object.keys(ITEMS);
const ACT = { straw: 'straw', worker: 'dig', sapling: 'sapling', conifer: 'sapling', seed: 'seed', water: 'water', stake: 'stake', rock: 'rock' };
const step = (item, text) => ({ item, act: ACT[item], text });

/* 18 種樹＝6 種地形 × 3 種樹，各有自己的種樹流程（每步都有對應動畫） */
const FLOWS = [
  { id: 'populus', terrain: 'desert', env: '沙漠', tree: '胡楊', sp: 'populus', steps: [step('straw', '鋪草方格固沙'), step('worker', '工人挖樹坑'), step('sapling', '放入樹苗'), step('water', '澆水')] },
  { id: 'saxaul', terrain: 'desert', env: '沙漠', tree: '梭梭', sp: 'saxaul', seedKind: 'nut', steps: [step('straw', '鋪草方格固沙'), step('seed', '播下種子'), step('water', '澆水')] },
  { id: 'oleaster', terrain: 'desert', env: '沙漠', tree: '沙棗', sp: 'oleaster', steps: [step('worker', '工人挖樹坑'), step('sapling', '放入樹苗'), step('water', '澆水')] },

  { id: 'mangrove', terrain: 'coast', env: '海岸', tree: '水筆仔', sp: 'mangrove', seedKind: 'pod', steps: [step('worker', '工人整地挖穴'), step('seed', '插入胎生苗'), step('water', '澆水')] },
  { id: 'avicennia', terrain: 'coast', env: '海岸', tree: '海茄苳', sp: 'avicennia', seedKind: 'pod', steps: [step('worker', '工人整地挖穴'), step('seed', '插入胎生苗'), step('water', '澆水'), step('stake', '打木樁固定')] },
  { id: 'casuarina', terrain: 'coast', env: '海岸', tree: '木麻黃', sp: 'casuarina', steps: [step('worker', '工人挖樹坑'), step('conifer', '放入針葉苗'), step('stake', '立木樁防風')] },

  { id: 'camphor', terrain: 'hill', env: '山坡', tree: '樟樹', sp: 'camphor', steps: [step('rock', '砌石擋土'), step('worker', '工人挖樹坑'), step('sapling', '放入樹苗'), step('stake', '立木樁護苗')] },
  { id: 'acacia', terrain: 'hill', env: '山坡', tree: '相思樹', sp: 'acacia', seedKind: 'nut', steps: [step('rock', '砌石擋土'), step('seed', '播下種子'), step('water', '澆水')] },
  { id: 'goldenrain', terrain: 'hill', env: '山坡', tree: '台灣欒樹', sp: 'goldenrain', steps: [step('worker', '工人挖樹坑'), step('sapling', '放入樹苗'), step('stake', '立木樁護苗')] },

  { id: 'fir', terrain: 'alpine', env: '高山', tree: '台灣冷杉', sp: 'fir', steps: [step('rock', '砌石擋雪'), step('worker', '工人挖樹坑'), step('conifer', '放入針葉苗'), step('stake', '立木樁固定')] },
  { id: 'taiwania', terrain: 'alpine', env: '高山', tree: '台灣杉', sp: 'taiwania', steps: [step('worker', '工人挖樹坑'), step('conifer', '放入針葉苗'), step('water', '澆水')] },
  { id: 'juniper', terrain: 'alpine', env: '高山', tree: '玉山圓柏', sp: 'juniper', steps: [step('rock', '砌石擋風'), step('conifer', '放入針葉苗'), step('stake', '立木樁固定')] },

  { id: 'baldcypress', terrain: 'wetland', env: '濕地', tree: '落羽松', sp: 'baldcypress', steps: [step('worker', '工人挖穴'), step('conifer', '放入針葉苗'), step('water', '澆水')] },
  { id: 'willow', terrain: 'wetland', env: '濕地', tree: '水柳', sp: 'willow', steps: [step('worker', '工人挖穴'), step('sapling', '放入樹苗'), step('stake', '立木樁護苗'), step('water', '澆水')] },
  { id: 'bischofia', terrain: 'wetland', env: '濕地', tree: '茄苳', sp: 'bischofia', seedKind: 'nut', steps: [step('worker', '工人挖穴'), step('seed', '播下種子'), step('water', '澆水')] },

  { id: 'sakura', terrain: 'park', env: '公園', tree: '櫻花', sp: 'sakura', steps: [step('worker', '工人挖樹坑'), step('sapling', '放入樹苗'), step('stake', '立木樁護苗'), step('water', '澆水')] },
  { id: 'maple', terrain: 'park', env: '公園', tree: '楓香', sp: 'maple', steps: [step('worker', '工人挖樹坑'), step('sapling', '放入樹苗'), step('water', '澆水')] },
  { id: 'ginkgo', terrain: 'park', env: '公園', tree: '銀杏', sp: 'ginkgo', steps: [step('worker', '工人挖樹坑'), step('sapling', '放入樹苗'), step('stake', '立木樁護苗')] }
];
const TERRAIN_NAMES = ['desert', 'coast', 'hill', 'alpine', 'wetland', 'park'];

/* 格子區域的局部座標：寬 260、高 300；種樹點 P */
const PX = 130, PY = 205, STAKE_X = PX + 20;
const ROCKS = [[-46, -2, 13], [-17, -13, 12], [17, -13, 12], [46, -2, 13]];

/* ================= 狀態 ================= */
let W = 0, H = 0, DPR = 1, hudH = 56;
let beltTop = 0, beltH = 70, beltBottom = 0, R = 30;
let cellS = 1, cellsTop = 0, sceneH = 100, horizonY = 0, groundTop = 0;
let mode = 'menu';                 // menu | play | over
let diff = DIFFS[0], goal = DIFFS[0].goal, gameTime = DIFFS[0].time;
let score = 0, combo = 0, timeLeft = gameTime, trees = 0, g = 0, T = 0, winAt = 0;
const bests = {};
DIFFS.forEach(d => { bests[d.id] = 0; try { bests[d.id] = +localStorage.getItem('plantTreeBest3_' + d.id) || 0; } catch (e) {} });
const beltItems = []; let beltOffset = 0, spawnT = 0, uid = 1; const lastTypes = [];
const forest = [], popups = [], plantedList = [];
let queue = [], drag = null, hoverCell = null;

function freshV() { return { grid: 0, hole: 0, filled: 0, sapling: 0, sType: 'broad', pod: 0, pw: 0, sprout: 0, rocks: 0, stakeOn: 0, stakeD: 0, rope: 0, wet: 0, grow: 0, fade: 1, kick: 0 }; }
function makeCell(i) { return { flow: null, i, x: 0, y: 0, w: 0, h: 0, step: 0, q: [], cur: null, v: freshV(), locked: false, shake: 0, flash: 0, flashKind: 'ok', intro: 0, parts: [], seed: i * 13 + 5 }; }
function resetCell(cell) { cell.step = 0; cell.q = []; cell.cur = null; cell.v = freshV(); cell.locked = false; cell.parts = []; cell.seed += 7; cell.flash = 0; cell.shake = 0; }
const cells = [0, 1, 2].map(makeCell);

/* 每局抽 goal 種樹：先讓每個地形各出一種，再補足；越前面越簡單；同時在場的三格盡量是不同地形 */

/* ================= 格子：粒子 ================= */
function emit(cell, x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const ang = o.a0 !== undefined ? o.a0 + (o.a1 - o.a0) * Math.random() : Math.random() * TAU;
    const sp = o.s0 + (o.s1 - o.s0) * Math.random();
    cell.parts.push({
      x: x + (o.jx || 0) * (Math.random() - .5), y: y + (o.jy || 0) * (Math.random() - .5),
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: o.g || 0,
      life: o.life * (.7 + Math.random() * .6), max: o.life, size: o.size * (.7 + Math.random() * .6),
      col: o.cols[(Math.random() * o.cols.length) | 0], kind: o.kind || 'dot', rot: Math.random() * TAU, vr: (Math.random() - .5) * 6
    });
  }
}
function updateParts(cell, dt) {
  const P = cell.parts;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.life -= dt;
    if (p.life <= 0) { P.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === 'drop' && p.y >= PY + 4) {
      P.splice(i, 1);
      for (let k = 0; k < 2; k++) P.push({ x: p.x, y: PY + 4, vx: (Math.random() - .5) * 50, vy: -30 - Math.random() * 30, g: 300, life: .35, max: .35, size: 1.4, col: '#7fd0f5', kind: 'dot', rot: 0, vr: 0 });
    }
  }
}
function drawParts(c, cell) {
  for (const p of cell.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    c.globalAlpha = Math.min(1, a * 1.6); c.fillStyle = p.col;
    if (p.kind === 'leaf') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.beginPath(); c.ellipse(0, 0, p.size * 1.6, p.size * .8, 0, 0, TAU); c.fill(); c.restore(); }
    else if (p.kind === 'spark') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.beginPath();
      for (let i = 0; i < 4; i++) { c.rotate(PI / 2); c.moveTo(0, 0); c.lineTo(p.size * .35, p.size * .35); c.lineTo(0, p.size * 1.6); c.lineTo(-p.size * .35, p.size * .35); }
      c.fill(); c.restore();
    } else { circ(c, p.x, p.y, p.size * (p.kind === 'drop' ? 1 : a * .6 + .4)); c.fill(); }
  }
  c.globalAlpha = 1;
}

/* ================= 格子：每個步驟的動畫 ================= */
const A = {};
const dirt = { cols: ['#6a4527', '#8b5a34', '#a77746'], g: 380, life: .7, size: 2.6 };
const mud = { cols: ['#4e3a28', '#6b523a', '#7a6a50'], g: 380, life: .7, size: 2.8 };

/* 草方格 */
A.straw = {
  dur: .9,
  update(cell, a, p) {

/* 工人挖坑（海岸、濕地挖出來的是爛泥） */
function digPose(p) {
  const enter = clamp(p / .15, 0, 1), leave = clamp((p - .88) / .12, 0, 1);
  const wx = lerp(-34, PX - 44, easeOut(enter)) - easeIn(leave) * 70;
  const q = clamp((p - .15) / .72, 0, 1), ph = q * 3, fr = q >= 1 ? 0 : ph % 1;
  const deg = (q <= 0 || q >= 1) ? 20 : (fr < .62 ? lerp(25, -55, easeInOut(fr / .62)) : lerp(-55, 25, easeIn((fr - .62) / .38)));
  return { wx, alpha: 1 - leave, ang: deg * PI / 180, walking: enter < 1 || leave > 0, wp: p * 34, ph };
}
A.dig = {
  dur: 1.4,
  update(cell, a, p) {
    cell.v.hole = easeInOut(clamp((p - .12) / .74, 0, 1));
    const o = digPose(p), k = p > .15 && p < .88 ? Math.min(3, Math.floor(o.ph)) : (a.k || 0);

  },
  draw(c, cell, a, p) {

    const kind = 'worker', y = PY + 2, x = o.wx, hx = x + 9, hy = y - 38;
    c.save(); c.globalAlpha = o.alpha;
    drawWorker(c, x, y, 1, o.wp, o.walking, kind);
    drawShovel(c, hx, hy, o.ang);
    drawArm(c, x + 2, y - 44, hx, hy, kind);
    c.restore();
  }
};

/* 放樹苗（闊葉樹苗、針葉樹苗共用） */
A.sapling = {
  dur: .8,
  update(cell, a, p) {
    if (p >= .5 && !a.l) { a.l = 1; cell.v.sapling = 1; cell.v.sType = a.item === 'conifer' ? 'conifer' : 'broad'; emit(cell, PX, PY + 4, 9, Object.assign({ a0: -PI * .95, a1: -PI * .05, s0: 30, s1: 80, jx: 20 }, dirt)); }

};

/* 澆水 */
const CAN_TIP = [-40, -10], CAN_TILT = 36 * PI / 180, CAN_BASE = [PX + 8, PY - 70];
function canPose(p) {
  const e = clamp(p / .22, 0, 1), l = clamp((p - .85) / .15, 0, 1);
  const tilt = CAN_TILT * easeOut(e) * (1 - l), a = -CAN_TILT;
  const fx = CAN_TIP[0] * Math.cos(a) - CAN_TIP[1] * Math.sin(a), fy = CAN_TIP[0] * Math.sin(a) + CAN_TIP[1] * Math.cos(a);
  const ox = (1 - easeOut(e)) * 110 + easeIn(l) * 90, oy = -(1 - easeOut(e)) * 70 - easeIn(l) * 60;
  const px = CAN_BASE[0] - fx + ox, py = CAN_BASE[1] - fy + oy, ra = -tilt;
  const tx = px + CAN_TIP[0] * Math.cos(ra) - CAN_TIP[1] * Math.sin(ra), ty = py + CAN_TIP[0] * Math.sin(ra) + CAN_TIP[1] * Math.cos(ra);
  return { px, py, ra, tx, ty, alpha: 1 - l };
}

  dur: 1.3,

    }

  draw(c, cell, a, p) { const o = canPose(p); if (o.alpha <= 0) return; c.save(); c.globalAlpha = o.alpha; drawCan(c, o.px, o.py, o.ra); c.restore(); }
};

/* 播種：胎生苗（紅樹）插進泥裡；一般種子落下後冒出新芽 */
A.seed = {
  dur: .8,
  update(cell, a, p) {

    if (pod) cell.v.pw = p > .55 ? Math.sin(q * 20) * .16 * (1 - q) : 0; else cell.v.sprout = easeOut(q);
    cell.v.filled = easeOut(q);

/* 打木樁（工人拿木槌，三下打入） */
const HITS = [.42, .62, .82];
const stakeD = p => HITS.reduce((s, t) => s + clamp((p - t) / .05, 0, 1) / 3, 0);
function malletR(p) {

  for (const t of HITS) { if (p >= t - .1 && p <= t) r = 1 - easeIn((p - (t - .1)) / .1); else if (p > t && p <= t + .08) r = Math.min(r, easeOut((p - t) / .08)); }
  return r;
}
A.stake = {
  dur: 1.4,
  update(cell, a, p) {

    const hi = HITS.filter(t => p >= t).length;
    if (hi > (a.h || 0)) { a.h = hi; cell.v.kick = 1; emit(cell, STAKE_X, PY + 3, 7, Object.assign({ a0: -PI * .95, a1: -PI * .05, s0: 30, s1: 80, jx: 10 }, dirt)); }
  },
  draw(c, cell, a, p) {

    const enter = clamp(p / .15, 0, 1), leave = clamp((p - .9) / .1, 0, 1);
    const wx = lerp(300, PX + 62, easeOut(enter)) + easeIn(leave) * 70, y = PY + 2, hx = wx - 8, hy = y - 44;
    c.save(); c.globalAlpha = 1 - leave;
    drawWorker(c, wx, y, -1, p * 34, enter < 1 || leave > 0, 'worker');
    const topY = PY + 4 - lerp(56, 40, stakeD(p)), hitA = Math.atan2((topY - 6) - hy, STAKE_X - hx);
    drawMallet(c, hx, hy, lerp(hitA, -PI / 2, malletR(p)));

/* 砌石 */
A.rock = {
  dur: 1.0,
  update(cell, a, p) {
    const n = ROCKS.filter((r, i) => p >= i * .17 + .3).length;
    if (n > cell.v.rocks) { const r = ROCKS[n - 1]; cell.v.rocks = n; cell.shake = Math.max(cell.shake, .25); emit(cell, PX + r[0], PY + 4 + r[1], 8, { a0: -PI * .95, a1: -PI * .05, s0: 25, s1: 70, jx: 16, cols: ['#b8aea0', '#8f8c88'], g: 260, life: .5, size: 2.4 }); }
  },
  draw(c, cell, a, p) {
    ROCKS.forEach((r, i) => { const q = (p - i * .17) / .3; if (q > 0 && q < 1) drawRock(c, PX + r[0], PY + 4 + r[1] + lerp(-140, 0, easeIn(q)), r[2], i + cell.seed); });
  }
};

/* 長成大樹、慶祝、淡出 */
A.grow = {
  dur: 1.2,
  update(cell, a, p, dt) {
    cell.v.grow = Math.max(.001, p);
    a.sp = (a.sp || 0) + dt * 40;
    while (a.sp >= 1) { a.sp--; emit(cell, PX + (Math.random() - .5) * 90, PY - 30 - Math.random() * 100, 1, { s0: 5, s1: 25, g: -10, life: .7, size: 3.2, cols: ['#fff6b0', '#ffffff', '#ffe27a'], kind: 'spark' }); }
  },
  draw(c, cell, a, p) { c.strokeStyle = 'rgba(255,255,255,' + (.85 * (1 - p)) + ')'; c.lineWidth = 3; const rr = 20 + p * 80; ell(c, PX, PY + 4, rr, rr * .32); c.stroke(); },
  end(cell) { onTreeDone(cell); }
};
A.hold = {
  dur: .55,
  update(cell, a) {
    cell.v.grow = 1;
    if (!a.f) { a.f = 1; emit(cell, 130, -6, 24, { a0: PI * .2, a1: PI * .8, s0: 20, s1: 80, jx: 240, g: 90, life: 1.5, size: 3, cols: ['#8bd66e', '#f7d154', '#ff9db0', '#ffffff', '#5fbf55'], kind: 'leaf' }); }
  }
};
A.reset = {
  dur: .5,
  update(cell, a, p) { cell.v.grow = 1; cell.v.fade = 1 - easeInOut(p); },
  end(cell) { resetCell(cell); assignNext(cell); }
};

function onTreeDone(cell) {
  const f = cell.flow; if (!f) return;
  trees++; plantedList.push(f); const mult = multOf(), gain = TREE_PTS * mult; score += gain;
  addForest(f.sp);
  popup(cell.x + cell.w / 2, cell.y + cell.h * .22, f.tree + ' +' + gain, '#fff3a8', 22);
  SFX.tree(); updatePips(true);
  if (trees >= goal && !winAt) winAt = T + 1.8;
}

function updateCell(cell, dt) {
  cell.shake = Math.max(0, cell.shake - dt * 3); cell.flash = Math.max(0, cell.flash - dt * 3); cell.intro = Math.max(0, cell.intro - dt * 2.2);
  cell.v.kick = Math.max(0, (cell.v.kick || 0) - dt * 8);
  updateParts(cell, dt);
  if (!cell.flow) return;
  if (!cell.cur && cell.q.length) { const e = cell.q.shift(); cell.cur = { name: e.name, item: e.item, t: 0, dur: A[e.name].dur }; }
  const a = cell.cur; if (!a) return;
  a.t += dt; const p = clamp(a.t / a.dur, 0, 1);
  A[a.name].update(cell, a, p, dt);
  if (a.t >= a.dur) { const fin = A[a.name].end; cell.cur = null; if (fin) fin(cell); }
}

/* ================= 格子：六種地形 ================= */
function sunDisc(c, x, y, r, col) {

queue = buildQueue(DIFFS[1]); cells.forEach(assignNext);   // 開場畫面先排好三格
try {
  document.fonts.load('700 20px "LXGW WenKai TC"', '種樹吧沙漠胡楊梭梭沙棗海岸水筆仔海茄苳木麻黃山坡樟相思台灣欒高山冷杉圓柏濕地落羽松水柳茄苳公園櫻花楓香銀杏種好了生長中這格都種完').catch(() => {});
  document.fonts.load('500 14px "Noto Sans TC"', '工人涉水針葉苗樹苗種子淡海草方格木樁石塊鋪挖坑放入澆插打固定砌擋土立護整地穴引潮施中順序不對浪費了抓馬上用整理材料下一步播下胎生防風雪').catch(() => {});
} catch (e) {}
window.__treeDebug = {
  cells, forest, plantedList, FLOWS, DIFFS,
  state: () => ({ mode, diff: diff.id, goal, score, combo, trees, timeLeft, g, queue: queue.length }),
  plant: (i, type) => dropOn(cells[i], type, cells[i].x + cells[i].w / 2, cells[i].y + 60),
  assign: (i, id) => { const c = cells[i]; resetCell(c); c.flow = FLOWS.find(f => f.id === id) || null; c.intro = 0; },
  show: (i, id) => { const c = cells[i]; resetCell(c); c.flow = FLOWS.find(f => f.id === id); c.intro = 0; c.v.grow = 1; c.step = c.flow.steps.length; c.locked = true; },
  setTrees: n => { forest.length = 0; plantedList.length = 0; trees = n; FLOWS.slice(0, n).forEach(f => { addForest(f.sp); plantedList.push(f); }); updatePips(); },
  start: id => startGame(DIFFS.find(d => d.id === id) || diff), belt: beltItems,
  tick: sec => { const n = Math.max(1, Math.round(sec / .05)); for (let i = 0; i < n; i++) { T += .05; update(.05); } render(); updateHUD(); }
};
requestAnimationFrame(frame);
})();
</script>
